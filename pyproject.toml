[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-jit"
version = "0.1.0"
description = "Local Agentic RAG and JIT PDF retrieval prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "PyMuPDF>=1.23,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "ldap3>=2.9,<3",
  "pyahocorasick==2.2.0",
  "tantivy==0.27.0",
  "jieba==0.42.1",
  "regex==2024.11.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]
mcp = ["mcp>=1.30,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
